# REUSE.toml — FSFE REUSE 3.0 compliant license declarations
#
# This file declares the SPDX license and copyright for groups of files by glob.
# It complements the human-readable LICENSE file. Current-phase assignment:
#   - software code                    -> MIT
#   - documentation (.md / .mdx)       -> MIT
#   - visual elements                  -> CC0-1.0
#   - infrastructure & config           -> CC0-1.0
#
# Run `uv run reuse lint` to verify compliance.

version = 3

# ---------------------------------------------------------------------------
# Software code — MIT
# ---------------------------------------------------------------------------
[[annotations]]
path = ["**/*.py"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NovelAI Image MCP contributors"
SPDX-License-Identifier = "MIT"

# ---------------------------------------------------------------------------
# License text files — MIT (the LICENSE files themselves carry the MIT text;
# REUSE needs to know they are MIT-licensed to avoid "missing license info").
# ---------------------------------------------------------------------------
[[annotations]]
path = ["LICENSE", "**/LICENSE", "LICENSES/MIT.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NovelAI Image MCP contributors"
SPDX-License-Identifier = "MIT"

# ---------------------------------------------------------------------------
# Documentation — MIT
# ---------------------------------------------------------------------------
[[annotations]]
path = ["**/*.md", "**/*.mdx"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NovelAI Image MCP contributors"
SPDX-License-Identifier = "MIT"

# ---------------------------------------------------------------------------
# Visual elements — CC0 1.0 Universal Public Domain Dedication
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
  "**/*.webp",
  "**/*.gif",
  "**/*.ico",
  "**/*.svg",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NovelAI Image MCP contributors"
SPDX-License-Identifier = "CC0-1.0"

# ---------------------------------------------------------------------------
# Infrastructure, configuration & build files — CC0 1.0
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  # config & data formats
  "**/*.yml",
  "**/*.yaml",
  "**/*.json",
  "**/*.jsonc",
  "**/*.toml",
  "**/*.lock",
  "**/*.cfg",
  "**/*.xml",
  "**/*.ini",
  # stylesheets (apps/docs/source/_static/custom.css — Sphinx theme overrides)
  "**/*.css",
  # Sphinx Jinja templates (apps/docs/source/_templates/**/*.html —
  # language switcher, sidebar overrides; build infrastructure, not docs)
  "**/*.html",
  # makefiles (apps/docs/Makefile)
  "**/Makefile",
  # docker / compose (Dockerfile lives at apps/server/Dockerfile; the root
  # .dockerignore scopes the build context)
  "**/Dockerfile",
  "docker-compose.yml",
  # github ownership routing (extensionless)
  "**/CODEOWNERS",
  # husky hooks (extensionless shell scripts)
  ".husky/*",
  # dotfiles & env examples (recursive)
  "**/.gitignore",
  "**/.gitattributes",
  "**/.dockerignore",
  ".env*",
  # explicit root dotfiles (belt-and-suspenders for `**/` matching)
  ".gitignore",
  ".gitattributes",
  ".dockerignore",
  ".editorconfig",
  ".prettierignore"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NovelAI Image MCP contributors"
SPDX-License-Identifier = "CC0-1.0"

# ---------------------------------------------------------------------------
# Build artifacts — CC0 1.0
# ---------------------------------------------------------------------------
# Python bytecode caches (``*.pyc``, ``__pycache__/``), pytest / coverage
# outputs, Sphinx build output (apps/docs/_build/), the Turborepo cache
# (.turbo/), and the bundled Node.js toolchain under ``node_modules/`` are
# all derivative artifacts that REUSE still scans; we annotate them as CC0
# (public domain) to avoid false "missing license" reports. They are also in
# .gitignore and never committed.
[[annotations]]
path = [
  "**/*.pyc",
  "**/*.pyo",
  "**/*.pyd",
  "**/*.so",
  "**/*.egg-info/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.mypy_cache/**",
  "**/.pyright/**",
  "**/htmlcov/**",
  "**/.coverage",
  "**/.coverage.*",
  "**/coverage.xml",
  "**/test-results/**",
  # Sphinx build output (apps/docs/_build/**)
  "**/_build/**",
  # Turborepo cache
  "**/.turbo/**",
  # uv cache (per-user)
  "**/.uv-cache/**",
  # Node toolchain
  "node_modules/**",
  # Agent / tool caches (never committed but scanned by REUSE)
  ".trae/**",
  ".codex/**",
  ".firecrawl/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NovelAI Image MCP contributors"
SPDX-License-Identifier = "CC0-1.0"
