# Root pyproject.toml — uv workspace root (virtual, not a package).
#
# This file declares the uv workspace; per-package dependencies and tool
# configuration live in each member's pyproject.toml:
#   - apps/server/pyproject.toml  — MCP server (real package, builds a wheel)
#   - apps/docs/pyproject.toml   — Sphinx documentation site (virtual project)
#
# Run `uv sync` from the repository root to materialize the shared workspace
# virtualenv. Run `uv run --directory apps/server <cmd>` (or
# `uv run --package novelai-image-mcp <cmd>`) to scope a command to a member.

[tool.uv]
# Root is a virtual workspace, not an installable project.
package = false

[tool.uv.workspace]
members = ["apps/server", "apps/docs"]

# ─────────────────────────────────────────────────────────────────────────────
# Shared dev tooling (installed into the root workspace virtualenv)
# ─────────────────────────────────────────────────────────────────────────────
# Repo-wide concerns only. Per-package dev tools (ruff, pyright, pytest,
# poethepoet) live in apps/server/pyproject.toml; per-docs dev tools
# (sphinx-autobuild) live in apps/docs/pyproject.toml.
[dependency-groups]
dev = [{ include-group = "lint" }]
lint = [
    # FSFE REUSE compliance — runs from the repo root to scan the whole tree.
    "reuse[charset-normalizer]>=5.0.0",
    # prek runs from the repo root to wire repo-wide pre-commit hooks.
    "prek>=0.4.14",
]
