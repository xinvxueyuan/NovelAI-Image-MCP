<?xml version="1.0" encoding="UTF-8"?>
<!-- NovelAI Image MCP — minimal brand mark.
     Violet-to-pink gradient evokes generative imagery; the inner aperture
     evokes a camera lens (image generation). Designed to render at any size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NovelAI Image MCP">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round">
    <circle cx="32" cy="32" r="14"/>
    <circle cx="32" cy="32" r="5.5" fill="#ffffff" stroke="none"/>
    <line x1="32" y1="6" x2="32" y2="14"/>
    <line x1="32" y1="50" x2="32" y2="58"/>
    <line x1="6" y1="32" x2="14" y2="32"/>
    <line x1="50" y1="32" x2="58" y2="32"/>
  </g>
</svg>
