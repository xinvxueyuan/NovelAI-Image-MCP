# Dependabot — keeps GitHub Actions, Python deps, Node tooling, and Docker
# base images current. Each updater runs weekly with a coordinated
# open-PR-per-ecosystem policy.

version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────
  # Pin updates for workflow dependencies. Most actions are pinned by SHA
  # in the workflows; Dependabot will open PRs to bump the SHAs (and the
  # inline `# pinned from <repo>@<tag>` comments document the provenance).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "⬆️ build(deps):"
    groups:
      github-actions:
        patterns:
          - "*"

  # ── Python (uv) ───────────────────────────────────────────────────
  # Tracks the installable server package's runtime + dev dependencies.
  # The root pyproject.toml holds the workspace declaration + repo-wide
  # dev tools (reuse, prek); apps/server/pyproject.toml holds the server
  # runtime + per-package dev tools (ruff, pyright, pytest, poethepoet).
  # uv.lock is updated by the `uv lock` step in the post-update command so
  # the lockfile and manifest stay in sync.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "⬆️ build(deps):"
    groups:
      # Patch + minor updates bundle together; major bumps open individually.
      python-minor:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # ── npm (pnpm) ───────────────────────────────────────────────────
  # Tracks the cross-cutting Node toolchain at the workspace root
  # (turbo, husky, markdownlint-cli2, rimraf, eslint-plugin-turbo).
  # None of the workspace packages carry Node runtime deps.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "⬆️ build(deps):"
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # ── Docker base image ─────────────────────────────────────────────
  # Bumps the `python:3.13-slim` base image digest in apps/server/Dockerfile.
  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "⬆️ build(deps):"
