name: 🚀 Release

on:
  push:
    branches:
      - "releases/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: 🔎 Validate release input
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to push the synced package.json commit back to the release branch
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 🔖 Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#releases/}"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 🔎 Verify version matches apps/server/pyproject.toml
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # The installable package manifest lives at apps/server/pyproject.toml
          # (the root pyproject.toml is a virtual uv workspace root with no version).
          project_version=$(grep -E '^version\s*=' apps/server/pyproject.toml | head -1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          if [ "$project_version" != "$version" ]; then
            echo "Version mismatch: apps/server/pyproject.toml has '$project_version', expected '$version'" >&2
            exit 1
          fi

      - name: 🔄 Sync version to all manifests
        # Propagate the validated version into every Node package.json and
        # the MCP registry manifest (server.json) so a single edit
        # (apps/server/pyproject.toml) is enough to bump the whole
        # workspace. The composite action also re-asserts that every
        # version-bearing file agrees before downstream jobs see the tree.
        uses: ./.github/actions/sync-version
        with:
          version: ${{ steps.version.outputs.version }}

      - name: 📤 Commit synced manifests back to the release branch
        # The sync step above edits the package.json manifests and
        # server.json in the job workspace. To make the bump stick in the
        # repo (so future clones and the post-release git tree show
        # consistent versions) we push the edits back to the triggering
        # branch. workflow_dispatch triggered against a tag has no writable
        # ref, so we only commit when the run is anchored to a branch (the
        # release-branch flow).
        if: startsWith(github.ref, 'refs/heads/releases/')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/server/package.json apps/docs/package.json server.json
          if git diff --cached --quiet; then
            echo "No version drift in manifests — already in sync."
          else
            git commit -m "🔧 chore(release): sync manifest versions to ${{ steps.version.outputs.version }}"
            git push
          fi

  build:
    name: 📦 Build artifacts
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write  # required for provenance attestation
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: ⚡ Setup uv
        # pinned from astral-sh/setup-uv@v8.3.2
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🔨 Build wheel and sdist
        # Build only the server package (the workspace root is a virtual
        # manifest and apps/docs is `package = false` — neither is publishable).
        run: uv build --package novelai-image-mcp

      - name: 📤 Upload artifacts
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: 📦 Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/novelai-image-mcp/
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - name: 📥 Download artifacts
        # pinned from actions/download-artifact@v5.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist/

      - name: 🚀 Publish to PyPI (trusted publisher)
        # pinned from pypa/gh-action-pypi-publish@v1.14.2
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  publish-ghcr:
    name: 🐳 Publish to GHCR
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # OIDC for cosign keyless signing
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔑 Log in to GHCR
        # pinned from docker/login-action@v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Extract metadata
        id: meta
        # pinned from docker/metadata-action@v5.8.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 注意：``type=semver,pattern={{version}}`` 仅在 ``github.ref`` 形如
          # ``refs/tags/...`` 时才会设置 ``version.main``。在 workflow_dispatch
          # 触发时（即使 ref 指向 ``releases/0.1.0`` 分支），该路径被跳过，
          # 只会生成 ``sha-*`` 标签，导致 0.1.0 镜像缺失。因此用 ``type=raw``
          # 显式将 validate job 解析出来的 ``${{ env.VERSION }}`` 注入到标签
          # 列表中，保证 ``0.1.0`` / ``0.1`` / ``0`` 在两种触发方式下都生成。
          tags: |
            type=raw,value=${{ env.VERSION }},priority=950,enable=${{ env.VERSION != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=NovelAI Image MCP
            org.opencontainers.image.description=MCP server exposing NovelAI image generation as tools for AI agents
            org.opencontainers.image.licenses=MIT

      - name: 🐳 Set up Buildx
        # pinned from docker/setup-buildx-action@v3.11.1
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: 🔨 Build & push
        # Build context is the repo root so uv can resolve the workspace graph;
        # the Dockerfile lives at apps/server/Dockerfile. The step id is reused
        # by the cosign signing step below to obtain the manifest digest —
        # ``steps.meta.outputs.digest`` is empty when multiple tags are pushed
        # (semver + sha), so the build-push-action output is the reliable
        # source of the single manifest digest that all tags resolve to.
        # pinned from docker/build-push-action@v6.18.0
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.date }}

      - name: ✍️ Install cosign
        # pinned from sigstore/cosign-installer@v3.9.0
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: 🔏 Sign image (keyless)
        # The repository name may contain uppercase characters (e.g.
        # ``NovelAI-Image-MCP``) which are not valid in OCI image
        # references — cosign rejects them with
        # ``could not parse reference: ...@sha256:...``. Lowercase the
        # image name for the cosign call only; the published tags on GHCR
        # still match the case pushed by the build step (the GHCR registry
        # normalises internally and ``docker pull`` handles the
        # case-insensitive lookup the same way).
        #
        # 注意：cosign 的 ``--replace`` 标志只对 ``cosign attest`` 存在，
        # 对 ``cosign sign`` 在任何发布版本中均不可用，因此不能在 sign
        # 步骤中直接重写签名来获得幂等性。实际失败原因是 Rekor 透明度
        # 日志在签完名后的回查步骤出现瞬时 404
        # （``getLogEntryByUuidNotFound``，见 sigstore/cosign#2208 与
        # ublue-os/bluefin#60）—— 推送的 tag 替换旧 digest 时尤其容易
        # 触发。这里用一段 bash 指数退避重试（最多 5 次）吸收瞬时故障，
        # 使 workflow 在重跑 / 手动 dispatch 时具备幂等性。
        run: |
          image_ref="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')@${{ steps.build.outputs.digest }}"
          echo "Signing ${image_ref}"
          max_attempts=5
          attempt=1
          delay=15
          until cosign sign --yes "${image_ref}"; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "cosign sign failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "cosign sign failed (attempt ${attempt}/${max_attempts}), retrying in ${delay}s..." >&2
            sleep "${delay}"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

  github-release:
    name: 🏷️ Create GitHub Release
    needs: [validate, build, publish-pypi, publish-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 📥 Download artifacts
        # pinned from actions/download-artifact@v5.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist/

      - name: 📝 Generate release notes
        id: notes
        shell: bash
        run: |
          # gh api fetches auto-generated release notes (uses .github/release.yml)
          NOTES=$(gh api -X POST repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name=v${{ env.VERSION }} \
            -f target_commitish=${{ github.sha }} \
            --jq '.body')
          # Persist to a file so the create-release step can reference it.
          printf '%s' "$NOTES" > RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📣 Append Product Hunt launch embed
        # Append a self-contained Product Hunt featured card to the auto-
        # generated release notes. GitHub renders inline HTML in release
        # notes, so the inline-styled <div> shows up as a promo card
        # pointing back to the Product Hunt product page. The file is only
        # consumed by the create-release step below when the release does
        # not already exist; the re-upload branch skips notes entirely.
        shell: bash
        run: |
          cat >> RELEASE_NOTES.md <<'PH_EMBED'

          ---

          <div style="font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif; border: 1px solid rgb(224, 224, 224); border-radius: 12px; padding: 20px; max-width: 500px; background: rgb(255, 255, 255); box-shadow: rgba(0, 0, 0, 0.05) 0px 2px 8px;"><div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;"><img alt="NovelAI Image MCP" src="https://ph-files.imgix.net/b0074845-f016-4b8e-9282-bd4d395cd817.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&h=80&w=80" style="width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0;"><div style="flex: 1 1 0%; min-width: 0px;"><h3 style="margin: 0px; font-size: 18px; font-weight: 600; color: rgb(26, 26, 26); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">NovelAI Image MCP</h3><p style="margin: 4px 0px 0px; font-size: 14px; color: rgb(102, 102, 102); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">MCP server for integrating NovelAI Image generation into AI</p></div></div><a href="https://www.producthunt.com/products/novelai-image-mcp?embed=true&utm_source=embed&utm_medium=post_embed" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 8px 16px; background: rgb(255, 97, 84); color: rgb(255, 255, 255); text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 600;">Check it out on Product Hunt →</a></div>
          PH_EMBED

      - name: 🏷️ Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --target ${{ github.sha }} \
              dist/*
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish to the official MCP Registry (registry.modelcontextprotocol.io).
  #
  # Inlined from the former publish-mcp.yml tag-triggered workflow: the v* tag
  # created by the github-release job uses GITHUB_TOKEN, which GitHub does not
  # re-dispatch as a tag-push event, so a separate on-push-tags workflow never
  # fired. Running the publish here (after PyPI + GHCR are live) makes the
  # registry update automatic on every release. Ownership validation by
  # mcp-publisher needs the just-published PyPI / GHCR artifacts, hence the
  # `needs` list below.
  #
  # Authentication: GitHub OIDC — no secrets required. Only `id-token: write`
  # is needed to mint the OIDC token that mcp-publisher exchanges for registry
  # credentials under the io.github.xinvxueyuan/* namespace.
  publish-mcp:
    name: 📋 Publish to MCP Registry
    needs: [validate, publish-pypi, publish-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for mcp-publisher github-oidc login
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔎 Verify server.json version matches release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ env.VERSION }}"
          json_version=$(jq -r '.version' server.json)
          if [ "$json_version" != "$version" ]; then
            echo "Version mismatch: server.json has '$json_version', release is '$version'" >&2
            exit 1
          fi
          echo "✓ server.json version ($json_version) matches release ($version)"

      - name: ⬇️ Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help

      - name: ✅ Validate server.json against schema
        shell: bash
        run: ./mcp-publisher validate ./server.json

      - name: 🔑 Login to MCP Registry (GitHub OIDC)
        shell: bash
        run: ./mcp-publisher login github-oidc

      - name: 🚀 Publish to MCP Registry
        shell: bash
        run: ./mcp-publisher publish

      - name: 🔍 Verify publication
        shell: bash
        run: |
          set -euo pipefail
          server_name="io.github.xinvxueyuan/novelai-image-mcp"
          echo "Searching registry for $server_name..."
          # The registry search API may take a few seconds to index the new
          # entry; retry a few times before declaring failure.
          #
          # Response shape (v0):
          #   {"servers":[{"server":{"name":"...","version":"..."}, "_meta":{...}}]}
          # The server payload is nested under `.server`, not at the top level
          # of each entry — filter on `.server.name`.
          max_attempts=5
          attempt=1
          until curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=${server_name}" \
                | jq -e --arg name "$server_name" \
                    '.servers[] | select(.server.name == $name)' >/dev/null; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "Server $server_name not found in registry after ${attempt} attempts" >&2
              echo "Manual check: curl 'https://registry.modelcontextprotocol.io/v0/servers?search=${server_name}'" >&2
              exit 1
            fi
            echo "Not indexed yet (attempt ${attempt}/${max_attempts}), retrying in 15s..." >&2
            sleep 15
            attempt=$((attempt + 1))
          done
          echo "✓ Server $server_name is now listed in the MCP Registry"
          echo "  View at: https://github.com/mcp/xinvxueyuan/novelai-image-mcp"
