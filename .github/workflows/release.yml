name: 🚀 Release

on:
  push:
    branches:
      - "releases/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: 🔎 Validate release input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: 🔖 Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#releases/}"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release version: $version" >&2; exit 1 ;;
          esac
          # Emit the full semver and the minor / major aliases. The publish
          # jobs use these to assemble the GHCR tag list without relying on
          # the docker/metadata-action semver patterns (which only fire on
          # git tag pushes, not on ``releases/X.Y.Z`` branch pushes).
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$version" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          echo "major=$(echo "$version" | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: 🔎 Verify version matches apps/server/pyproject.toml
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # The installable package manifest lives at apps/server/pyproject.toml
          # (the root pyproject.toml is a virtual uv workspace root with no version).
          project_version=$(grep -E '^version\s*=' apps/server/pyproject.toml | head -1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          if [ "$project_version" != "$version" ]; then
            echo "Version mismatch: apps/server/pyproject.toml has '$project_version', expected '$version'" >&2
            exit 1
          fi

  build:
    name: 📦 Build artifacts
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write  # required for provenance attestation
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: ⚡ Setup uv
        # pinned from astral-sh/setup-uv@v8.3.2
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🔨 Build wheel and sdist
        # Build only the server package (the workspace root is a virtual
        # manifest and apps/docs is `package = false` — neither is publishable).
        run: uv build --package novelai-image-mcp

      - name: 📤 Upload artifacts
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: 📦 Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/novelai-image-mcp/
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - name: 📥 Download artifacts
        # pinned from actions/download-artifact@v5.0.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: python-distributions
          path: dist/

      - name: 🔍 Skip if version already on PyPI
        # PyPI rejects duplicate uploads for the same filename. The
        # pypa/gh-action-pypi-publish action has no skip-existing input, so
        # we add a version check before invoking it. Re-runs of the release
        # workflow (e.g. after a workflow fix) will then be idempotent.
        id: skip
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if curl -fsS -o /dev/null \
              "https://pypi.org/pypi/novelai-image-mcp/${VERSION}/json"; then
            echo "Version ${VERSION} already on PyPI — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${VERSION} not on PyPI — publishing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Publish to PyPI (trusted publisher)
        if: steps.skip.outputs.skip != 'true'
        # pinned from pypa/gh-action-pypi-publish@v1.13.0
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e

  publish-ghcr:
    name: 🐳 Publish to GHCR
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # OIDC for cosign keyless signing
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      MINOR: ${{ needs.validate.outputs.minor }}
      MAJOR: ${{ needs.validate.outputs.major }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: 🔑 Log in to GHCR
        # pinned from docker/login-action@v3.5.0
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Extract metadata
        id: meta
        # pinned from docker/metadata-action@v5.8.0
        # Use ``type=raw`` against ``env.VERSION`` (extracted from the branch
        # name in the validate job) instead of ``type=semver,pattern={{version}}``
        # because the latter only resolves when the trigger is an actual git
        # tag push. A push to ``releases/0.1.0`` is a branch ref, not a tag,
        # so the semver patterns expand to nothing and the image gets only the
        # ``sha-`` tag — losing the user-facing ``0.1.0``/``0.1``/``0`` tags.
        # We derive the minor and major aliases from the validated version
        # string with bash (PARAM_VER_MINOR / PARAM_VER_MAJOR below) and
        # expose them as ``steps.meta.outputs.version`` aliases.
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ env.MINOR }}
            type=raw,value=${{ env.MAJOR }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=NovelAI Image MCP
            org.opencontainers.image.description=MCP server exposing NovelAI image generation as tools for AI agents
            org.opencontainers.image.licenses=MIT

      - name: 🐳 Set up Buildx
        # pinned from docker/setup-buildx-action@v3.11.1
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: 🔨 Build & push
        # Build context is the repo root so uv can resolve the workspace graph;
        # the Dockerfile lives at apps/server/Dockerfile. The step id is reused
        # by the cosign signing step below to obtain the manifest digest —
        # ``steps.meta.outputs.digest`` is empty when multiple tags are pushed
        # (semver + sha), so the build-push-action output is the reliable
        # source of the single manifest digest that all tags resolve to.
        # pinned from docker/build-push-action@v6.18.0
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.date }}

      - name: ✍️ Install cosign
        # pinned from sigstore/cosign-installer@v3.9.0
        uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3

      - name: 🔏 Sign image (keyless)
        # The repository name may contain uppercase characters (e.g.
        # ``NovelAI-Image-MCP``) which are not valid in OCI image
        # references — cosign rejects them with
        # ``could not parse reference: ...@sha256:...``. Lowercase the
        # image name for the cosign call only; the published tags on GHCR
        # still match the case pushed by the build step (the GHCR registry
        # normalises internally and ``docker pull`` handles the
        # case-insensitive lookup the same way).
        run: |
          image_ref="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')@${{ steps.build.outputs.digest }}"
          echo "Signing ${image_ref}"
          cosign sign --yes "${image_ref}"

  github-release:
    name: 🏷️ Create GitHub Release
    needs: [validate, build, publish-pypi, publish-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: 📥 Download artifacts
        # pinned from actions/download-artifact@v5.0.0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: python-distributions
          path: dist/

      - name: 📝 Generate release notes
        id: notes
        shell: bash
        run: |
          # gh api fetches auto-generated release notes (uses .github/release.yml)
          NOTES=$(gh api -X POST repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name=v${{ env.VERSION }} \
            -f target_commitish=${{ github.sha }} \
            --jq '.body')
          # Persist to a file so the create-release step can reference it.
          printf '%s' "$NOTES" > RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --target ${{ github.sha }} \
              dist/*
          fi
