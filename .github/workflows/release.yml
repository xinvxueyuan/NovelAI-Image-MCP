name: 🚀 Release

on:
  push:
    branches:
      - "releases/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: 🔎 Validate release input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 🔖 Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#releases/}"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 🔎 Verify version matches apps/server/pyproject.toml
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # The installable package manifest lives at apps/server/pyproject.toml
          # (the root pyproject.toml is a virtual uv workspace root with no version).
          project_version=$(grep -E '^version\s*=' apps/server/pyproject.toml | head -1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          if [ "$project_version" != "$version" ]; then
            echo "Version mismatch: apps/server/pyproject.toml has '$project_version', expected '$version'" >&2
            exit 1
          fi

  build:
    name: 📦 Build artifacts
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write  # required for provenance attestation
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: ⚡ Setup uv
        # pinned from astral-sh/setup-uv@v8.3.2
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🔨 Build wheel and sdist
        # Build only the server package (the workspace root is a virtual
        # manifest and apps/docs is `package = false` — neither is publishable).
        run: uv build --package novelai-image-mcp

      - name: 📤 Upload artifacts
        # pinned from actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: 📦 Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/novelai-image-mcp/
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - name: 📥 Download artifacts
        # pinned from actions/download-artifact@v5.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist/

      - name: 🚀 Publish to PyPI (trusted publisher)
        # pinned from pypa/gh-action-pypi-publish@v1.13.0
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247

  publish-ghcr:
    name: 🐳 Publish to GHCR
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # OIDC for cosign keyless signing
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔑 Log in to GHCR
        # pinned from docker/login-action@v3.5.0
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Extract metadata
        id: meta
        # pinned from docker/metadata-action@v5.8.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=NovelAI Image MCP
            org.opencontainers.image.description=MCP server exposing NovelAI image generation as tools for AI agents
            org.opencontainers.image.licenses=MIT

      - name: 🐳 Set up Buildx
        # pinned from docker/setup-buildx-action@v3.11.1
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: 🔨 Build & push
        # Build context is the repo root so uv can resolve the workspace graph;
        # the Dockerfile lives at apps/server/Dockerfile.
        # pinned from docker/build-push-action@v6.18.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.date }}

      - name: ✍️ Install cosign
        # pinned from sigstore/cosign-installer@v3.9.0
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: 🔏 Sign image (keyless)
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.meta.outputs.digest }}

  github-release:
    name: 🏷️ Create GitHub Release
    needs: [validate, build, publish-pypi, publish-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 📥 Download artifacts
        # pinned from actions/download-artifact@v5.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist/

      - name: 📝 Generate release notes
        id: notes
        shell: bash
        run: |
          # gh api fetches auto-generated release notes (uses .github/release.yml)
          NOTES=$(gh api -X POST repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name=v${{ env.VERSION }} \
            -f target_commitish=${{ github.sha }} \
            --jq '.body')
          # Persist to a file so the create-release step can reference it.
          printf '%s' "$NOTES" > RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --target ${{ github.sha }} \
              dist/*
          fi
