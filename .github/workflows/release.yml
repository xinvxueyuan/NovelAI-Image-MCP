name: 🚀 Release

# Releases are driven by the baseline branch: bump the version on `main`, run
# the manifest sync, commit, push, then push the tag. The tag names the
# release and the tagged commit is the artifact that gets published.
#
# This workflow VERIFIES the manifests instead of writing them: the version
# can never change underneath a published artifact, and the release-notes
# body comes from the JSON document committed with the version bump
# (release-notes/<version>.json). Push to main first, run
# `uv run --directory apps/server poe sync-versions`, commit, and only then
# tag.
#
# `workflow_dispatch` re-runs a release for an existing tag (transient
# failure, refreshed notes) without rewriting the tag.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)publish; the v<version> tag must already exist"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: 🔎 Validate the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history: the baseline check below needs the tag commit's
          # ancestry, and the docs changelog wants the previous tag.
          fetch-depth: 0

      - name: 🔖 Resolve the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Invalid release version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: 🧭 Confirm the tag is on the baseline
        # A tag alone is not a release decision: it must name a commit that
        # already landed on main, so the published artifact always matches
        # the baseline history.
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG does not exist; push the tag before dispatching" >&2
            exit 1
          fi
          release_sha="$(git rev-list -n 1 "$TAG")"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "::error::$TAG points at $release_sha, which is not on main; cut releases from the baseline" >&2
            exit 1
          fi
          echo "$TAG is on main ($release_sha)"

      - name: 🔎 Verify apps/server/pyproject.toml carries the version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The installable package manifest lives at apps/server/pyproject.toml
          # (the root pyproject.toml is a virtual uv workspace root with no version).
          project_version=$(grep -E '^version\s*=' apps/server/pyproject.toml | head -1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          if [ "$project_version" != "$VERSION" ]; then
            echo "::error::apps/server/pyproject.toml has $project_version, the tag says $VERSION" >&2
            exit 1
          fi
          echo "✓ pyproject.toml version matches the tag ($VERSION)"

      - name: 🧾 Verify every derived manifest is in sync
        # Verification only, never a write: the manifests (three package.json
        # files and server.json) are synced locally with `poe sync-versions`
        # and committed before the tag is pushed.
        run: python3 apps/server/scripts/sync_versions.py --check

      - name: 📝 Verify CHANGELOG.md documents the version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [${VERSION}] section" >&2
            exit 1
          fi
          echo "✓ CHANGELOG.md documents $VERSION"

      - name: 🗒️ Render the JSON release notes
        # release-notes/<version>.json is the authored announcement; the
        # renderer validates it (required keys, no unknown keys) and emits the
        # Markdown body the github-release job publishes.
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 apps/server/scripts/release_notes.py --version "$VERSION" --output RELEASE_NOTES.md
          echo '### Release notes preview' >> "$GITHUB_STEP_SUMMARY"
          head -40 RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload the rendered notes
        # pinned from actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  build:
    name: 📦 Build artifacts
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write  # required for provenance attestation
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: ⚡ Setup uv
        # pinned from astral-sh/setup-uv@v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🔨 Build wheel and sdist
        # Build only the server package (the workspace root is a virtual
        # manifest and apps/docs is `package = false` — neither is publishable).
        run: uv build --package novelai-image-mcp

      - name: 📤 Upload artifacts
        # pinned from actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: 📦 Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/novelai-image-mcp/
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - name: 📥 Download artifacts
        # pinned from actions/download-artifact@v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-distributions
          path: dist/

      - name: 🚀 Publish to PyPI (trusted publisher)
        # pinned from pypa/gh-action-pypi-publish@v1.14.3
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086

  publish-ghcr:
    name: 🐳 Publish to GHCR
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # OIDC for cosign keyless signing
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔑 Log in to GHCR
        # pinned from docker/login-action@v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Extract metadata
        id: meta
        # pinned from docker/metadata-action@v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # ``type=semver`` needs ``github.ref`` to look like ``refs/tags/...``,
          # which tag pushes provide but ``workflow_dispatch`` does not (its ref
          # is the branch). ``type=raw`` therefore injects the version the
          # validate job resolved, so ``0.5.2`` / ``0.5`` / ``0`` are always
          # published regardless of how the run started.
          tags: |
            type=raw,value=${{ env.VERSION }},priority=950,enable=${{ env.VERSION != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=NovelAI Image MCP
            org.opencontainers.image.description=MCP server exposing NovelAI image generation as tools for AI agents
            org.opencontainers.image.licenses=MIT

      - name: 🐳 Set up Buildx
        # pinned from docker/setup-buildx-action@v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: 🔨 Build & push
        # Build context is the repo root so uv can resolve the workspace graph;
        # the Dockerfile lives at apps/server/Dockerfile. The step id is reused
        # by the cosign signing step below to obtain the manifest digest —
        # ``steps.meta.outputs.digest`` is empty when multiple tags are pushed
        # (semver + sha), so the build-push-action output is the reliable
        # source of the single manifest digest that all tags resolve to.
        # pinned from docker/build-push-action@v7.4.0
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.date }}

      - name: ✍️ Install cosign
        # pinned from sigstore/cosign-installer@v4.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: 🔏 Sign image (keyless)
        # The repository name may contain uppercase characters (e.g.
        # ``NovelAI-Image-MCP``) which are not valid in OCI image references —
        # cosign rejects them with ``could not parse reference: ...@sha256:...``.
        # Lowercase the image name for the cosign call only; the published tags
        # on GHCR still match the case pushed by the build step.
        #
        # ``cosign sign`` has no ``--replace`` (that exists only for ``cosign
        # attest``), so a re-run cannot rewrite a signature idempotently. The
        # usual failure is a transient Rekor lookup 404 after signing
        # (sigstore/cosign#2208), most likely when a tag is moved onto a new
        # digest; the exponential backoff below absorbs it.
        run: |
          image_ref="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')@${{ steps.build.outputs.digest }}"
          echo "Signing ${image_ref}"
          max_attempts=5
          attempt=1
          delay=15
          until cosign sign --yes "${image_ref}"; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "cosign sign failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "cosign sign failed (attempt ${attempt}/${max_attempts}), retrying in ${delay}s..." >&2
            sleep "${delay}"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

  github-release:
    name: 🏷️ Create GitHub Release
    needs: [validate, build, publish-pypi, publish-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 📥 Download artifacts
        # pinned from actions/download-artifact@v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-distributions
          path: dist/

      - name: 📥 Download the rendered notes
        # pinned from actions/download-artifact@v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-notes

      - name: 📜 Append the auto-generated commit list
        # The JSON document is the announcement; the commit list below is the
        # exhaustive diff-oriented companion, grouped by .github/release.yml.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            printf '\n\n---\n\n## 📜 Full changelog\n\n'
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq '.body'
          } >> RELEASE_NOTES.md

      - name: 📣 Append Product Hunt launch embed
        # A fixed promo card, so it lives here rather than in every JSON
        # document. GitHub renders inline HTML in release notes.
        shell: bash
        run: |
          cat >> RELEASE_NOTES.md <<'PH_EMBED'

          ---

          <div style="font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif; border: 1px solid rgb(224, 224, 224); border-radius: 12px; padding: 20px; max-width: 500px; background: rgb(255, 255, 255); box-shadow: rgba(0, 0, 0, 0.05) 0px 2px 8px;"><div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;"><img alt="NovelAI Image MCP" src="https://ph-files.imgix.net/b0074845-f016-4b8e-9282-bd4d395cd817.svg?auto=compress,format&codec=mozjpeg&cs=strip&fit=crop&h=80&w=80" style="width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0;"><div style="flex: 1 1 0%; min-width: 0px;"><h3 style="margin: 0px; font-size: 18px; font-weight: 600; color: rgb(26, 26, 26); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">NovelAI Image MCP</h3><p style="margin: 4px 0px 0px; font-size: 14px; color: rgb(102, 102, 102); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">MCP server for integrating NovelAI Image generation into AI</p></div></div><a href="https://www.producthunt.com/products/novelai-image-mcp?embed=true&utm_source=embed&utm_medium=post_embed" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 8px 16px; background: rgb(255, 97, 84); color: rgb(255, 255, 255); text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 600;">Check it out on Product Hunt →</a></div>
          PH_EMBED

      - name: 🏷️ Create or refresh the release
        # The tag already exists (it is what triggered the run), so the release
        # is created against it with --verify-tag. A re-run refreshes both the
        # notes and the assets instead of failing on an existing release.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing notes and assets."
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              dist/*
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish to the official MCP Registry (registry.modelcontextprotocol.io).
  #
  # Inlined rather than a separate tag-triggered workflow so one tag push
  # publishes everywhere atomically, after PyPI and GHCR are live (ownership
  # validation by mcp-publisher reads the just-published artifacts, hence the
  # `needs` list below). A second workflow listening on the same tag would
  # duplicate that verification for no benefit; publish-mcp.yml stays available
  # for manual re-publication after fixing server.json.
  #
  # Authentication: GitHub OIDC — no secrets required. Only `id-token: write`
  # is needed to mint the OIDC token that mcp-publisher exchanges for registry
  # credentials under the io.github.xinvxueyuan/* namespace.
  publish-mcp:
    name: 📋 Publish to MCP Registry
    needs: [validate, publish-pypi, publish-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for mcp-publisher github-oidc login
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 🔎 Verify server.json version matches release
        # Belt and braces: the validate job already ran the manifest sync in
        # --check mode, and this is the file the registry reads.
        shell: bash
        run: |
          set -euo pipefail
          version="${{ env.VERSION }}"
          json_version=$(jq -r '.version' server.json)
          if [ "$json_version" != "$version" ]; then
            echo "Version mismatch: server.json has $json_version, release is $version" >&2
            exit 1
          fi
          echo "✓ server.json version ($json_version) matches release ($version)"

      - name: ⬇️ Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help

      - name: ✅ Validate server.json against schema
        shell: bash
        run: ./mcp-publisher validate ./server.json

      - name: 🔑 Login to MCP Registry (GitHub OIDC)
        shell: bash
        run: ./mcp-publisher login github-oidc

      - name: 🚀 Publish to MCP Registry
        shell: bash
        run: ./mcp-publisher publish

      - name: 🔍 Verify publication
        shell: bash
        run: |
          set -euo pipefail
          server_name="io.github.xinvxueyuan/novelai-image-mcp"
          echo "Searching registry for $server_name..."
          # The registry search API may take a few seconds to index the new
          # entry; retry a few times before declaring failure.
          #
          # Response shape (v0):
          #   {"servers":[{"server":{"name":"...","version":"..."}, "_meta":{...}}]}
          # The server payload is nested under `.server`, not at the top level
          # of each entry — filter on `.server.name`.
          max_attempts=5
          attempt=1
          until curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=${server_name}" \
                | jq -e --arg name "$server_name" \
                    '.servers[] | select(.server.name == $name)' >/dev/null; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "Server $server_name not found in registry after ${attempt} attempts" >&2
              echo "Manual check: curl 'https://registry.modelcontextprotocol.io/v0/servers?search=${server_name}'" >&2
              exit 1
            fi
            echo "Not indexed yet (attempt ${attempt}/${max_attempts}), retrying in 15s..." >&2
            sleep 15
            attempt=$((attempt + 1))
          done
          echo "✓ Server $server_name is now listed in the MCP Registry"
          echo "  View at: https://github.com/mcp/xinvxueyuan/novelai-image-mcp"
