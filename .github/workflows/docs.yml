name: 📚 Docs

on:
  push:
    branches: [main]
    paths:
      # Rebuild the site only when docs source or the autodoc introspection
      # surface (server package) changes.
      - "apps/docs/**"
      - "apps/server/src/**"
      - "apps/server/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# `id-token: write` is required by actions/deploy-pages for OIDC;
# `pages: write` lets the workflow publish to the Pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 📦 Build Sphinx site (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      # If any language fails (e.g., a broken cross-reference in zh), cancel
      # the others so we never deploy a partial site.
      fail-fast: true
      matrix:
        language: ['en', 'zh', 'ja']
    steps:
      - name: 📥 Checkout
        # pinned from actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: ⚡ Setup uv
        # pinned from astral-sh/setup-uv@v8.3.2
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 📥 Sync workspace
        # Sync the full workspace (server + docs) so autodoc can introspect
        # the in-tree novelai_image_mcp package. Skip the dev/test groups.
        run: uv sync --no-dev --all-extras --frozen

      - name: 🔨 Build HTML (${{ matrix.language }})
        # Build with -W --keep-going so any Sphinx warning fails the build
        # but every warning is reported in a single pass. --fail-on-warning
        # would stop at the first warning and hide the rest.
        #
        # English builds from the source root (which defaults to
        # `language = "en"` in conf.py). Translated builds point at the
        # per-language source tree, share the root conf.py via `-c`, and
        # override `language` so html_title / html_context branch correctly.
        run: |
          if [ "${{ matrix.language }}" = "en" ]; then
            uv run --package novelai-image-mcp-docs \
              sphinx-build -b html \
                apps/docs/source apps/docs/_build/html \
                -W --keep-going
          else
            uv run --package novelai-image-mcp-docs \
              sphinx-build -b html \
                apps/docs/source/${{ matrix.language }} apps/docs/_build/html \
                -c apps/docs/source \
                -D language=${{ matrix.language }} \
                -W --keep-going
          fi

      - name: 📦 Upload language artifact
        # pinned from actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-${{ matrix.language }}
          path: apps/docs/_build/html/
          retention-days: 1

  combine:
    name: 🔗 Combine language artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Configure GitHub Pages
        # pinned from actions/configure-pages@v5.0.0
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: false  # we don't try to enable Pages on the repo from CI

      - name: 📥 Download all language artifacts
        # pinned from actions/download-artifact@v4.3.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          pattern: docs-*
          merge-multiple: false

      - name: 🔗 Arrange into subpath layout
        # English at the Pages root, each translated language under its own
        # ISO 639-1 subpath so the language switcher can swap prefixes.
        run: |
          mkdir -p staging
          # English at root
          cp -r artifacts/docs-en/* staging/
          # Chinese at /zh/
          mkdir -p staging/zh
          cp -r artifacts/docs-zh/* staging/zh/
          # Japanese at /ja/
          mkdir -p staging/ja
          cp -r artifacts/docs-ja/* staging/ja/

      - name: 📄 Inject Pages base URL
        # Sphinx writes absolute URLs (e.g. /_static/...) by default. For
        # project Pages (https://<org>.github.io/<repo>/), rewrite them to
        # the proper base so assets load correctly. Applies to every
        # language subtree under staging/.
        if: steps.pages.outputs.base_path != ''
        run: |
          base="${{ steps.pages.outputs.base_path }}"
          find staging -type f -name '*.html' -print0 \
            | xargs -0 sed -i "s|href=\"/|href=\"${base}/|g; s|src=\"/|src=\"${base}/|g"

      - name: 📤 Upload Pages artifact
        # pinned from actions/upload-pages-artifact@v3.0.1
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: staging

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: combine
    # Deploy only on pushes to main (skip workflow_dispatch to allow previewing
    # the build artifact without publishing).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        # pinned from actions/deploy-pages@v4.0.1
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
